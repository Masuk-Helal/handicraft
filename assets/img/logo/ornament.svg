<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 64 42" width="64" height="42">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E3C27A"/>
      <stop offset="1" stop-color="#B8863A"/>
    </linearGradient>
    <!-- one petal, pivot at its base (0,0), pointing up -->
    <path id="petal" d="M0 0C-4.6-8-4.6-21 0-31 4.6-21 4.6-8 0 0Z"/>
  </defs>

  <g fill="url(#gold)">
    <!-- fan of petals -->
    <use xlink:href="#petal" transform="translate(32 34) rotate(-72) scale(.52)"/>
    <use xlink:href="#petal" transform="translate(32 34) rotate(-48) scale(.68)"/>
    <use xlink:href="#petal" transform="translate(32 34) rotate(-24) scale(.84)"/>
    <use xlink:href="#petal" transform="translate(32 34)"/>
    <use xlink:href="#petal" transform="translate(32 34) rotate(24) scale(.84)"/>
    <use xlink:href="#petal" transform="translate(32 34) rotate(48) scale(.68)"/>
    <use xlink:href="#petal" transform="translate(32 34) rotate(72) scale(.52)"/>

    <!-- dots at the petal tips -->
    <circle cx="32" cy="0.8" r="1.4"/>
    <circle cx="20.6" cy="9.6" r="1.1"/>
    <circle cx="43.4" cy="9.6" r="1.1"/>

    <!-- base with curled ends -->
    <path d="M12 38.5c4-3.2 9-4.6 20-4.6s16 1.4 20 4.6c-.6 1.3-1.9 1.9-3.2 1.4-3.9-2-8.6-3-16.8-3s-12.9 1-16.8 3c-1.3.5-2.6-.1-3.2-1.4Z"/>
    <circle cx="10.4" cy="37.4" r="2"/>
    <circle cx="53.6" cy="37.4" r="2"/>
  </g>
</svg>
